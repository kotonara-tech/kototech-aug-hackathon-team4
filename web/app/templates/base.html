<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}定点カメラ{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <a class="header__title" href="/">定点カメラ</a>
    {% if user %}
    <div class="header__user">
      <span class="header__email">{{ user.email }}</span>
      <a class="header__logout" href="/logout">ログアウト</a>
    </div>
    {% endif %}
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
